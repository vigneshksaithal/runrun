<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>RunRun</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #0f1928;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}
		canvas {
			display: block;
			width: 100% !important;
			height: 100% !important;
			position: absolute;
			top: 0;
			left: 0;
			/* Allow horizontal touch gestures for game swipes, but let vertical scroll pass through */
			touch-action: pan-x;
		}
	</style>
</head>

<body>
	<!--
	  Scroll passthrough: forward wheel and vertical-dominant touch events
	  to the Reddit parent frame so the page scrolls normally when the
	  user is not actively swiping to control the game.
	-->
	<script>
		(function () {
			// Forward wheel (desktop scroll) to parent Reddit page
			window.addEventListener('wheel', function (e) {
				if (window.parent && window.parent !== window) {
					window.parent.postMessage(
						{ type: 'devvit-scroll', deltaY: e.deltaY, deltaX: e.deltaX },
						'*'
					);
				}
			}, { passive: true });

			// Detect vertical-dominant touch swipes and let them bubble to Reddit.
			// The canvas has touch-action: pan-x, so only horizontal touches are
			// captured by the game; vertical ones are passed through natively.
			// This script handles the edge-case where the browser needs an explicit
			// signal to scroll the outer frame inside a sandboxed iframe.
			var touchStartY = 0;
			var touchStartX = 0;

			document.addEventListener('touchstart', function (e) {
				if (e.touches.length === 1) {
					touchStartY = e.touches[0].clientY;
					touchStartX = e.touches[0].clientX;
				}
			}, { passive: true });

			document.addEventListener('touchmove', function (e) {
				if (e.touches.length !== 1) return;
				var dy = e.touches[0].clientY - touchStartY;
				var dx = e.touches[0].clientX - touchStartX;
				// If vertical movement dominates, forward to parent for scrolling
				if (Math.abs(dy) > Math.abs(dx) && window.parent && window.parent !== window) {
					window.parent.postMessage(
						{ type: 'devvit-scroll', deltaY: -dy },
						'*'
					);
				}
			}, { passive: true });
		})();
	</script>
	<script type="module" src="./main.ts"></script>
</body>

</html>
