<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>RunRun - Endless Runner</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: linear-gradient(180deg, #87ceeb 0%, #ffb782 50%, #ff8c5a 100%);
			touch-action: none;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		canvas {
			display: block;
			max-width: 100%;
			max-height: 100%;
			border-radius: 8px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
		}
	</style>
</head>

<body>
	<script type="module" src="./main.ts"></script>
</body>

</html>
