<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>RunRun - Endless Runner</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			touch-action: none;
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			user-select: none;
		}

		.preview-container {
			width: 100%;
			height: 100%;
			background: linear-gradient(180deg, #40aafa 0%, #78c8fc 55%, #c4eafc 72%, #68c458 72%, #4ea546 100%);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			position: relative;
			overflow: hidden;
			cursor: pointer;
		}

		.bg-layer {
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		/* Sun */
		.sun {
			position: absolute;
			right: 12%;
			top: 8%;
			width: 70px;
			height: 70px;
			border-radius: 50%;
			background: radial-gradient(circle, #fffce6 55%, #fff0aa 100%);
			box-shadow: 0 0 50px 20px rgba(255, 240, 170, 0.5);
		}

		/* Clouds */
		.cloud {
			position: absolute;
			background: #ffffff;
			border-radius: 50px;
			opacity: 0.95;
			animation: drift 18s linear infinite;
		}
		.cloud::before,
		.cloud::after {
			content: '';
			position: absolute;
			background: #ffffff;
			border-radius: 50%;
		}
		.cloud-1 { width: 70px; height: 22px; left: 12%; top: 18%; }
		.cloud-1::before { width: 34px; height: 34px; top: -16px; left: 10px; }
		.cloud-1::after { width: 26px; height: 26px; top: -12px; right: 12px; }
		.cloud-2 { width: 54px; height: 18px; left: 60%; top: 30%; animation-delay: 6s; }
		.cloud-2::before { width: 26px; height: 26px; top: -12px; left: 8px; }
		.cloud-2::after { width: 20px; height: 20px; top: -9px; right: 8px; }

		@keyframes drift {
			0% { transform: translateX(-40px); }
			100% { transform: translateX(420px); }
		}

		/* Palm trees */
		.palm {
			position: absolute;
			bottom: 24%;
			width: 60px;
			height: 120px;
		}
		.palm-left { left: 4%; }
		.palm-right { right: 4%; transform: scaleX(-1); }
		.palm-trunk {
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 12px;
			height: 90px;
			background: linear-gradient(90deg, #8a5e38 0%, #6e4a2c 100%);
			border-radius: 6px;
		}
		.palm-canopy {
			position: absolute;
			top: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 64px;
			height: 50px;
		}
		.palm-canopy span {
			position: absolute;
			width: 36px;
			height: 22px;
			background: #38aa50;
			border-radius: 50%;
			top: 14px;
			left: 14px;
		}
		.palm-canopy span:nth-child(1) { transform: rotate(-35deg) translateX(-14px); background: #2f9446; }
		.palm-canopy span:nth-child(2) { transform: rotate(35deg) translateX(14px); background: #2f9446; }
		.palm-canopy span:nth-child(3) { transform: translateY(-12px); }

		/* Railway track */
		.track {
			position: absolute;
			bottom: 0;
			left: 50%;
			transform: translateX(-50%);
			width: 100%;
			height: 30%;
			background: linear-gradient(180deg, #b09474 0%, #8a6e50 100%);
			clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
		}
		.sleeper {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			height: 7px;
			background: #7a5638;
			border-radius: 2px;
		}
		.rail {
			position: absolute;
			bottom: 0;
			width: 5px;
			background: linear-gradient(90deg, #6c727e, #e4e8f0, #6c727e);
			transform-origin: bottom center;
		}

		.content {
			position: relative;
			z-index: 10;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 18px;
			padding: 20px;
			margin-bottom: 6%;
		}

		/* Runner (capped kid) */
		.runner-container {
			position: relative;
			width: 80px;
			height: 120px;
			animation: bounce 0.9s ease-in-out infinite;
		}
		@keyframes bounce {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-12px); }
		}
		.r-backpack {
			position: absolute; width: 50px; height: 40px; background: #46beaa;
			border-radius: 10px; left: 50%; top: 52px; transform: translateX(-50%);
		}
		.r-cap {
			position: absolute; width: 52px; height: 20px; background: #e43838;
			border-radius: 12px 12px 0 0; left: 50%; top: 4px; transform: translateX(-50%);
		}
		.r-cap-brim {
			position: absolute; width: 30px; height: 8px; background: #b82626;
			border-radius: 0 0 6px 6px; left: 50%; top: 22px; transform: translateX(-50%);
		}
		.r-head {
			position: absolute; width: 48px; height: 34px; background: #f4c8a2;
			border-radius: 8px; left: 50%; top: 18px; transform: translateX(-50%);
		}
		.r-eyes { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; }
		.eye { width: 7px; height: 7px; background: #1e1e24; border-radius: 50%; }
		.r-body {
			position: absolute; width: 56px; height: 42px; background: #f8f8fa;
			border-radius: 10px; left: 50%; top: 50px; transform: translateX(-50%);
			box-shadow: inset -8px 0 0 rgba(0,0,0,0.06);
		}
		.r-body::after {
			content: ''; position: absolute; width: 16px; height: 10px; background: #ffb028;
			border-radius: 4px; left: 12px; top: 12px;
		}
		.r-legs {
			position: absolute; width: 50px; height: 26px; left: 50%; bottom: 4px; transform: translateX(-50%);
			display: flex; justify-content: space-between;
		}
		.leg { width: 22px; height: 26px; background: #426cb2; border-radius: 4px; }
		.leg.dark { background: #2e508c; }
		.r-shoes {
			position: absolute; width: 54px; bottom: 0; left: 50%; transform: translateX(-50%);
			display: flex; justify-content: space-between;
		}
		.shoe { width: 24px; height: 9px; background: #fae240; border-radius: 4px; }

		.coin {
			position: absolute;
			width: 16px; height: 16px; border-radius: 50%;
			background: radial-gradient(circle at 35% 35%, #ffe26e, #ffc624 60%, #d69612);
			border: 2px solid #d69612;
			animation: spin 1.6s ease-in-out infinite;
		}
		.coin-1 { left: 30%; top: 46%; animation-delay: 0s; }
		.coin-2 { right: 30%; top: 52%; animation-delay: 0.4s; }
		.coin-3 { left: 50%; top: 40%; animation-delay: 0.8s; }
		@keyframes spin {
			0%, 100% { transform: scaleX(1); }
			50% { transform: scaleX(0.3); }
		}

		.title {
			font-size: 46px;
			font-weight: 800;
			letter-spacing: 4px;
			color: #ffffff;
			text-shadow: 0 3px 0 rgba(40, 48, 60, 0.25), 0 0 30px rgba(255, 255, 255, 0.4);
			margin-top: 6px;
		}
		.subtitle {
			font-size: 16px;
			color: #ffffff;
			letter-spacing: 1px;
			text-shadow: 0 1px 3px rgba(40, 48, 60, 0.3);
		}

		.play-btn {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 14px;
			padding: 20px 60px;
			background: linear-gradient(180deg, #4ade80 0%, #22c55e 50%, #16a34a 100%);
			border: none;
			border-radius: 16px;
			color: white;
			font-size: 28px;
			font-weight: 800;
			letter-spacing: 3px;
			cursor: pointer;
			box-shadow: 0 8px 0 #15803d, 0 10px 20px rgba(34, 197, 94, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.25);
			transition: all 0.12s ease;
			margin-top: 10px;
			animation: btnPulse 1.5s ease-in-out infinite;
			text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
			overflow: hidden;
		}
		.play-btn::before {
			content: '';
			position: absolute;
			top: 0;
			left: -100%;
			width: 100%;
			height: 100%;
			background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
			animation: shine 2.5s ease-in-out infinite;
		}
		@keyframes shine { 0% { left: -100%; } 50%, 100% { left: 100%; } }
		@keyframes btnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
		.play-btn:hover { transform: translateY(-4px) scale(1.08); }
		.play-btn:active { transform: translateY(4px) scale(1.02); animation: none; }
		.play-icon {
			width: 0; height: 0;
			border-left: 18px solid white;
			border-top: 12px solid transparent;
			border-bottom: 12px solid transparent;
			filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
		}

		.stats { display: flex; gap: 30px; margin-top: 12px; }
		.stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
		.stat-pill {
			display: flex; align-items: center; gap: 8px;
			background: rgba(44, 62, 92, 0.55);
			padding: 6px 14px; border-radius: 20px;
		}
		.coin-icon {
			width: 16px; height: 16px; border-radius: 50%;
			background: radial-gradient(circle at 35% 35%, #ffe26e, #ffc624 60%, #d69612);
			border: 2px solid #d69612;
		}
		.trophy-icon {
			width: 14px; height: 16px; background: #ffd24a; border-radius: 2px 2px 5px 5px; position: relative;
		}
		.trophy-icon::before {
			content: ''; position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
			width: 20px; height: 5px; background: inherit; border-radius: 2px;
		}
		.stat-value { font-size: 18px; font-weight: 700; color: #ffffff; }
		.stat-label { font-size: 11px; color: rgba(255, 255, 255, 0.85); text-transform: uppercase; letter-spacing: 1px; }
	</style>
</head>

<body>
	<div class="preview-container" id="preview">
		<div class="bg-layer">
			<div class="sun"></div>
			<div class="cloud cloud-1"></div>
			<div class="cloud cloud-2"></div>

			<!-- Railway track -->
			<div class="track"></div>
			<div class="rail" style="height:30%; left:38%; transform: rotate(11deg);"></div>
			<div class="rail" style="height:30%; left:46%; transform: rotate(4deg);"></div>
			<div class="rail" style="height:30%; right:46%; transform: rotate(-4deg);"></div>
			<div class="rail" style="height:30%; right:38%; transform: rotate(-11deg);"></div>
			<div class="sleeper" style="width:70px; bottom:18%;"></div>
			<div class="sleeper" style="width:100px; bottom:12%;"></div>
			<div class="sleeper" style="width:140px; bottom:6%;"></div>
			<div class="sleeper" style="width:190px; bottom:1%;"></div>

			<!-- Palms -->
			<div class="palm palm-left">
				<div class="palm-canopy"><span></span><span></span><span></span></div>
				<div class="palm-trunk"></div>
			</div>
			<div class="palm palm-right">
				<div class="palm-canopy"><span></span><span></span><span></span></div>
				<div class="palm-trunk"></div>
			</div>

			<!-- Floating coins -->
			<div class="coin coin-1"></div>
			<div class="coin coin-2"></div>
			<div class="coin coin-3"></div>
		</div>

		<div class="content">
			<!-- Runner -->
			<div class="runner-container">
				<div class="r-backpack"></div>
				<div class="r-cap"></div>
				<div class="r-cap-brim"></div>
				<div class="r-head">
					<div class="r-eyes"><div class="eye"></div><div class="eye"></div></div>
				</div>
				<div class="r-body"></div>
				<div class="r-legs"><div class="leg"></div><div class="leg dark"></div></div>
				<div class="r-shoes"><div class="shoe"></div><div class="shoe"></div></div>
			</div>

			<h1 class="title">RUNRUN</h1>
			<p class="subtitle">How far can you run?</p>

			<button class="play-btn" id="playBtn">
				<span class="play-icon"></span>
				PLAY
			</button>

			<div class="stats">
				<div class="stat">
					<div class="stat-pill">
						<div class="trophy-icon"></div>
						<span class="stat-value" id="highScore">0</span>
					</div>
					<span class="stat-label">Best</span>
				</div>
				<div class="stat">
					<div class="stat-pill">
						<div class="coin-icon"></div>
						<span class="stat-value" id="totalCoins">0</span>
					</div>
					<span class="stat-label">Coins</span>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="./preview.ts"></script>
</body>

</html>
